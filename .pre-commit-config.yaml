---
repos:
  - repo: local
    hooks:
      - id: audit-docs
        name: Audit LemGendary Docs (manifest, versions, MD/HTML parity, template, links, paths, names)
        entry: python scripts/audit_docs.py
        language: system
        pass_filenames: false
        always_run: true
      - id: yamllint
        name: yamllint (strict, .yamllint.yaml)
        entry: yamllint -s -c .yamllint.yaml
        language: system
        types: [yaml]
