<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <defs>
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a0a0f" />
      <stop offset="100%" stop-color="#14141e" />
    </linearGradient>
    <linearGradient id="step1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9500" />
      <stop offset="100%" stop-color="#ff5e3a" />
    </linearGradient>
    <linearGradient id="step2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007aff" />
      <stop offset="100%" stop-color="#5856d6" />
    </linearGradient>
    <linearGradient id="step3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34c759" />
      <stop offset="100%" stop-color="#30d158" />
    </linearGradient>
    <linearGradient id="step4Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#af52de" />
      <stop offset="100%" stop-color="#5e5ce6" />
    </linearGradient>
    <linearGradient id="step5Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c6ff" />
      <stop offset="100%" stop-color="#0072ff" />
    </linearGradient>
    <filter id="glow">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1000" height="480" rx="12" fill="url(#flowGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />

  <text x="500" y="45" fill="#ffffff" font-family="Outfit, sans-serif" font-size="20" font-weight="700" text-anchor="middle">End-to-End Production AI Pipeline (The Gardening Model Walkthrough)</text>
  <text x="500" y="70" fill="#a0a0b0" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">From Raw Photos in Your Backyard to a Production-Grade Deep Learning Model Published on Cloud Repositories</text>

  <!-- Connecting Arrows -->
  <path d="M 180 200 L 220 200" stroke="#007aff" stroke-width="3" stroke-dasharray="6,4" />
  <polygon points="220,195 230,200 220,205" fill="#007aff" />

  <path d="M 370 200 L 410 200" stroke="#007aff" stroke-width="3" stroke-dasharray="6,4" />
  <polygon points="410,195 420,200 410,205" fill="#007aff" />

  <path d="M 570 200 L 610 200" stroke="#007aff" stroke-width="3" stroke-dasharray="6,4" />
  <polygon points="610,195 620,200 610,205" fill="#007aff" />

  <path d="M 770 200 L 810 200" stroke="#007aff" stroke-width="3" stroke-dasharray="6,4" />
  <polygon points="810,195 820,200 810,205" fill="#007aff" />

  <!-- STEP 1 CARD -->
  <g filter="url(#glow)">
    <rect x="30" y="100" width="150" height="200" rx="10" fill="#121218" stroke="rgba(255,149,0,0.4)" stroke-width="1.5" />
    <rect x="45" y="115" width="120" height="24" rx="4" fill="url(#step1Grad)" />
    <text x="105" y="131" fill="#ffffff" font-family="Inter, sans-serif" font-size="10" font-weight="700" text-anchor="middle">STEP 1: SOURCES</text>
    <text x="105" y="165" fill="#ffffff" font-family="Outfit, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Collect Photos</text>
    <text x="105" y="190" fill="#888899" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Photos of leaves,</text>
    <text x="105" y="205" fill="#888899" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">flowers, vegetables</text>
    <text x="105" y="220" fill="#888899" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">or phone cameras.</text>
    <rect x="45" y="245" width="120" height="35" rx="4" fill="rgba(255,255,255,0.04)" />
    <text x="105" y="260" fill="#ff9500" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Drop in raw-sets/</text>
    <text x="105" y="273" fill="#666677" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Any image format</text>
  </g>

  <!-- STEP 2 CARD -->
  <g filter="url(#glow)">
    <rect x="220" y="100" width="150" height="200" rx="10" fill="#121218" stroke="rgba(0,122,255,0.4)" stroke-width="1.5" />
    <rect x="235" y="115" width="120" height="24" rx="4" fill="url(#step2Grad)" />
    <text x="295" y="131" fill="#ffffff" font-family="Inter, sans-serif" font-size="10" font-weight="700" text-anchor="middle">STEP 2: COMPILE</text>
    <text x="295" y="165" fill="#ffffff" font-family="Outfit, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Dataset Compiler</text>
    <text x="295" y="190" fill="#888899" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Lossless WebP</text>
    <text x="295" y="205" fill="#888899" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">WebDataset Shards</text>
    <text x="295" y="220" fill="#888899" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Aspect-Ratio Binning</text>
    <rect x="235" y="245" width="120" height="35" rx="4" fill="rgba(0,122,255,0.1)" />
    <text x="295" y="260" fill="#79c0ff" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">10x Speedup</text>
    <text x="295" y="273" fill="#666677" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Automated Janitor</text>
  </g>

  <!-- STEP 3 CARD -->
  <g filter="url(#glow)">
    <rect x="420" y="100" width="150" height="200" rx="10" fill="#121218" stroke="rgba(52,199,89,0.4)" stroke-width="1.5" />
    <rect x="435" y="115" width="120" height="24" rx="4" fill="url(#step3Grad)" />
    <text x="495" y="131" fill="#ffffff" font-family="Inter, sans-serif" font-size="10" font-weight="700" text-anchor="middle">STEP 3: TRAIN</text>
    <text x="495" y="165" fill="#ffffff" font-family="Outfit, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Training Suite</text>
    <text x="495" y="190" fill="#888899" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Pick Model via GUI</text>
    <text x="495" y="205" fill="#888899" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Sawtooth Governor</text>
    <text x="495" y="220" fill="#888899" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Zero Memory Crash</text>
    <rect x="435" y="245" width="120" height="35" rx="4" fill="rgba(52,199,89,0.1)" />
    <text x="495" y="260" fill="#34c759" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">1-Click Launch</text>
    <text x="495" y="273" fill="#666677" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">CUDA / DirectML / CPU</text>
  </g>

  <!-- STEP 4 CARD -->
  <g filter="url(#glow)">
    <rect x="620" y="100" width="150" height="200" rx="10" fill="#121218" stroke="rgba(175,82,222,0.4)" stroke-width="1.5" />
    <rect x="635" y="115" width="120" height="24" rx="4" fill="url(#step4Grad)" />
    <text x="695" y="131" fill="#ffffff" font-family="Inter, sans-serif" font-size="10" font-weight="700" text-anchor="middle">STEP 4: EVALUATE</text>
    <text x="695" y="165" fill="#ffffff" font-family="Outfit, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Live Telemetry</text>
    <text x="695" y="190" fill="#888899" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Live Loss Curves</text>
    <text x="695" y="205" fill="#888899" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">PSNR / SSIM / mAP</text>
    <text x="695" y="220" fill="#888899" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Before vs After Test</text>
    <rect x="635" y="245" width="120" height="35" rx="4" fill="rgba(175,82,222,0.1)" />
    <text x="695" y="260" fill="#af52de" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Auto Metrics Graphs</text>
    <text x="695" y="273" fill="#666677" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Saved to metrics.csv</text>
  </g>

  <!-- STEP 5 CARD -->
  <g filter="url(#glow)">
    <rect x="820" y="100" width="150" height="200" rx="10" fill="#121218" stroke="rgba(0,198,255,0.4)" stroke-width="1.5" />
    <rect x="835" y="115" width="120" height="24" rx="4" fill="url(#step5Grad)" />
    <text x="895" y="131" fill="#ffffff" font-family="Inter, sans-serif" font-size="10" font-weight="700" text-anchor="middle">STEP 5: PUBLISH</text>
    <text x="895" y="165" fill="#ffffff" font-family="Outfit, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Cloud Publishing</text>
    <text x="895" y="190" fill="#888899" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Export ONNX Model</text>
    <text x="895" y="205" fill="#888899" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Push to Kaggle Hub</text>
    <text x="895" y="220" fill="#888899" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Backup to Google Drive</text>
    <rect x="835" y="245" width="120" height="35" rx="4" fill="rgba(0,198,255,0.1)" />
    <text x="895" y="260" fill="#00c6ff" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Secrets Vault Armed</text>
    <text x="895" y="273" fill="#666677" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Automatic Versioning</text>
  </g>

  <!-- Explanatory Bottom Card for Beginners / Seniors -->
  <rect x="30" y="325" width="940" height="125" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" />
  <text x="50" y="352" fill="#ffffff" font-family="Outfit, sans-serif" font-size="14" font-weight="700">The Senior Citizen &amp; High School Student Rule: Simple, Resilient, Automated</text>
  <text x="50" y="375" fill="#a0a0b0" font-family="Inter, sans-serif" font-size="11">1. You never need to open a command line terminal or type code unless you want to.</text>
  <text x="50" y="395" fill="#a0a0b0" font-family="Inter, sans-serif" font-size="11">2. Every button has a small "?" hover icon that explains exactly what it does in simple English before you click it.</text>
  <text x="50" y="415" fill="#a0a0b0" font-family="Inter, sans-serif" font-size="11">3. The built-in Sawtooth Governor protects your computer: it dynamically adjusts memory so your machine never freezes or crashes.</text>
  <text x="50" y="435" fill="#a0a0b0" font-family="Inter, sans-serif" font-size="11">4. Secrets &amp; Cloud Tokens (Kaggle, Google Drive) are managed securely inside the GUI with masked password fields.</text>
</svg>
