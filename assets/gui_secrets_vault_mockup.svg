<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="100%" height="100%">
  <defs>
    <linearGradient id="modalBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141419" />
      <stop offset="100%" stop-color="#0e0e13" />
    </linearGradient>
    <linearGradient id="accentBtn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#007aff" />
      <stop offset="100%" stop-color="#0056b3" />
    </linearGradient>
    <filter id="modalDropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.75" />
    </filter>
  </defs>

  <!-- Backdrop Dimmer -->
  <rect x="0" y="0" width="900" height="620" fill="rgba(0,0,0,0.7)" />

  <!-- Modal Window -->
  <g filter="url(#modalDropShadow)">
    <rect x="50" y="30" width="800" height="560" rx="12" fill="url(#modalBg)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

    <!-- Modal Header -->
    <rect x="50" y="30" width="800" height="56" rx="12" fill="#181820" />
    <text x="75" y="65" fill="#ffffff" font-family="Outfit, sans-serif" font-size="16" font-weight="700">Universal Configuration &amp; Secrets Vault</text>
    <rect x="420" y="47" width="90" height="22" rx="4" fill="rgba(0,122,255,0.15)" stroke="#007aff" />
    <text x="465" y="62" fill="#79c0ff" font-family="Inter, sans-serif" font-size="10" font-weight="600" text-anchor="middle">ATOMIC .BAK</text>
    <circle cx="820" cy="58" r="10" fill="rgba(255,255,255,0.08)" />
    <text x="820" y="62" fill="#a0a0a0" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">✕</text>

    <!-- Tab Switcher -->
    <rect x="75" y="100" width="180" height="32" rx="6" fill="rgba(255,255,255,0.05)" />
    <text x="165" y="121" fill="#888899" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">Registry Manifests</text>

    <rect x="265" y="100" width="200" height="32" rx="6" fill="#007aff" />
    <text x="365" y="121" fill="#ffffff" font-family="Inter, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Secrets &amp; Tokens Vault</text>

    <!-- Service Selection Bar -->
    <text x="75" y="156" fill="#888899" font-family="Inter, sans-serif" font-size="11" font-weight="600">PREDEFINED SERVICES (SELECT TO MANAGE)</text>
    
    <!-- Kaggle (Mandatory - Active) -->
    <rect x="75" y="168" width="130" height="42" rx="6" fill="rgba(0,122,255,0.18)" stroke="#007aff" stroke-width="1.5" />
    <text x="90" y="193" fill="#ffffff" font-family="Inter, sans-serif" font-size="12" font-weight="700">Kaggle</text>
    <rect x="145" y="176" width="52" height="15" rx="3" fill="#ff3b30" />
    <text x="171" y="187" fill="#ffffff" font-family="Inter, sans-serif" font-size="8" font-weight="700" text-anchor="middle">REQUIRED</text>

    <!-- Google Drive -->
    <rect x="215" y="168" width="120" height="42" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" />
    <text x="235" y="193" fill="#e0e0e0" font-family="Inter, sans-serif" font-size="12">Google Drive</text>

    <!-- GitHub -->
    <rect x="345" y="168" width="100" height="42" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" />
    <text x="375" y="193" fill="#e0e0e0" font-family="Inter, sans-serif" font-size="12">GitHub</text>

    <!-- Hugging Face -->
    <rect x="455" y="168" width="125" height="42" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" />
    <text x="475" y="193" fill="#e0e0e0" font-family="Inter, sans-serif" font-size="12">Hugging Face</text>

    <!-- MetaTrader 5 -->
    <rect x="590" y="168" width="125" height="42" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" />
    <text x="610" y="193" fill="#e0e0e0" font-family="Inter, sans-serif" font-size="12">MetaTrader 5</text>

    <!-- Active Service Credentials Card: Kaggle -->
    <rect x="75" y="225" width="750" height="195" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.08)" />
    <text x="95" y="252" fill="#ffffff" font-family="Outfit, sans-serif" font-size="14" font-weight="700">Configured Kaggle Accounts (Multiple Allowed)</text>
    <text x="660" y="252" fill="#34c759" font-family="Inter, sans-serif" font-size="11" font-weight="600">2 Accounts Armed</text>

    <!-- Account Row 1 (Default) -->
    <rect x="95" y="268" width="710" height="52" rx="6" fill="#171720" stroke="rgba(0,122,255,0.3)" />
    <rect x="110" y="284" width="55" height="20" rx="3" fill="rgba(52,199,89,0.2)" stroke="#34c759" />
    <text x="137" y="298" fill="#34c759" font-family="Inter, sans-serif" font-size="9" font-weight="700" text-anchor="middle">DEFAULT</text>

    <text x="180" y="292" fill="#888899" font-family="Inter, sans-serif" font-size="10">USERNAME</text>
    <text x="180" y="308" fill="#ffffff" font-family="Inter, sans-serif" font-size="12" font-weight="600">lemgenda_primary</text>

    <text x="350" y="292" fill="#888899" font-family="Inter, sans-serif" font-size="10">API TOKEN / KEY</text>
    <text x="350" y="308" fill="#79c0ff" font-family="Fira Code, monospace" font-size="12">•••••••••••••••••••••••••••••</text>

    <!-- Show/Hide Button -->
    <rect x="580" y="282" width="60" height="24" rx="4" fill="rgba(255,255,255,0.06)" />
    <text x="610" y="298" fill="#a0a0a0" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Show</text>

    <!-- Delete Button -->
    <rect x="740" y="282" width="55" height="24" rx="4" fill="rgba(255,59,48,0.15)" stroke="rgba(255,59,48,0.3)" />
    <text x="767" y="298" fill="#ff3b30" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Remove</text>

    <!-- Account Row 2 -->
    <rect x="95" y="330" width="710" height="52" rx="6" fill="#121218" stroke="rgba(255,255,255,0.05)" />
    <rect x="110" y="346" width="65" height="20" rx="3" fill="rgba(255,255,255,0.05)" />
    <text x="142" y="360" fill="#888899" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Set Default</text>

    <text x="190" y="354" fill="#888899" font-family="Inter, sans-serif" font-size="10">USERNAME</text>
    <text x="190" y="370" fill="#e0e0e0" font-family="Inter, sans-serif" font-size="12">gardening_bot_2</text>

    <text x="350" y="354" fill="#888899" font-family="Inter, sans-serif" font-size="10">API TOKEN / KEY</text>
    <text x="350" y="370" fill="#79c0ff" font-family="Fira Code, monospace" font-size="12">•••••••••••••••••••••••••••••</text>

    <rect x="580" y="344" width="60" height="24" rx="4" fill="rgba(255,255,255,0.06)" />
    <text x="610" y="360" fill="#a0a0a0" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Show</text>

    <rect x="740" y="344" width="55" height="24" rx="4" fill="rgba(255,59,48,0.15)" stroke="rgba(255,59,48,0.3)" />
    <text x="767" y="360" fill="#ff3b30" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Remove</text>

    <!-- Add New Credential Form -->
    <rect x="75" y="430" width="750" height="90" rx="8" fill="rgba(0,122,255,0.03)" stroke="rgba(0,122,255,0.15)" />
    <text x="95" y="452" fill="#ffffff" font-family="Inter, sans-serif" font-size="12" font-weight="600">Add New Credential to Kaggle</text>

    <!-- Username Input -->
    <rect x="95" y="465" width="220" height="34" rx="5" fill="#14141c" stroke="rgba(255,255,255,0.1)" />
    <text x="110" y="487" fill="#666677" font-family="Inter, sans-serif" font-size="11">Enter Kaggle Username...</text>

    <!-- Token Input -->
    <rect x="330" y="465" width="310" height="34" rx="5" fill="#14141c" stroke="rgba(255,255,255,0.1)" />
    <text x="345" y="487" fill="#666677" font-family="Inter, sans-serif" font-size="11">Enter kaggle.json API Token Key...</text>

    <!-- Add Button -->
    <rect x="655" y="465" width="150" height="34" rx="5" fill="url(#accentBtn)" />
    <text x="730" y="487" fill="#ffffff" font-family="Inter, sans-serif" font-size="12" font-weight="600" text-anchor="middle">+ Add Credential</text>

    <!-- Footer Controls -->
    <line x1="75" y1="535" x2="825" y2="535" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <text x="75" y="562" fill="#888899" font-family="Inter, sans-serif" font-size="11">Stored safely in .secrets.yaml with automatic .bak backup</text>
    
    <rect x="685" y="542" width="140" height="34" rx="6" fill="#34c759" />
    <text x="755" y="563" fill="#ffffff" font-family="Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Save Vault &amp; Sync</text>
  </g>
</svg>
