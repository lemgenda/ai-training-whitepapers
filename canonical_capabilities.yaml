- id: forex_predictor
  name: Forex Predictor (Multi-Scale CNN-Transformer)
  category: forex
  domain: time_series_quantitative_finance
  general_ai_support: true
  studio_implementation_status: implemented
  runtime_baseline: v16.9.16-STABLE
  codebase_path: LemGendaryModels/ForexPredictor/ForexPredictor.py
  weights_path: LemGendaryModels/ForexPredictor/ForexPredictorWeights_FP32.pth
  architecture_type: Causal TCN + Multi-Head Cross-Timeframe Attention
  supported_formats:
    input:
    - csv
    - parquet
    - mt5_ticks
    manifold: tar_stream
  control_planes:
    gui:
      available: true
      element_id: model-select-forex-predictor
    cli:
      available: true
      command: python -m training.cli.lemtrain --model forex_predictor
    api:
      available: true
      route: POST /v16/train/start
      port: 8000
  hardware_constraints:
    min_vram_gb: 4.0
    recommended_batch_size: 128
    supports_amp: true
  evidence:
    manifest_entry: lemgendary-training-suite/unified_models_v2.yaml#forex_predictor
    whitepaper: lemgendary-docs/MD-Papers/PAPER_FOREX_PREDICTOR.md
  limitations:
  - Inference sub-5ms target applies to compiled ONNX runtime; PyTorch eager latency
    is ~12-18ms.
  - Requires continuous non-gapped M1-MN data.
  academic_reference:
    title: An Empirical Evaluation of Generic Convolutional and Recurrent Networks
      for Sequence Modeling
    authors: Shaojie Bai, J. Zico Kolter, Vladlen Koltun
    year: 2018
    venue: arXiv preprint
    link: https://arxiv.org/abs/1803.01271
    bibtex: "@article{bai2018empirical,\n  title={An empirical evaluation of generic\
      \ convolutional and recurrent networks for sequence modeling},\n  author={Bai,\
      \ Shaojie and Kolter, J Zico and Koltun, Vladlen},\n  journal={arXiv preprint\
      \ arXiv:1803.01271},\n  year={2018}\n}"
